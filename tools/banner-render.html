<!DOCTYPE html>
<!-- Source for assets/readme-banner.png (1280x400 @2x). Regenerate with tools/render-og.sh -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #04121C; width: 1280px; height: 400px; overflow: hidden; }
  .banner { position: relative; width: 1280px; height: 400px; overflow: hidden; color: #F7FBFA; font-family: "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  canvas { position: absolute; inset: 0; width: 1280px; height: 400px; }
  .glow { filter: blur(10px); opacity: .5; }
  .fade { position: absolute; inset: 0; background: linear-gradient(90deg, #04121C 0%, #04121C 36%, rgba(4,18,28,0) 70%); }
  .content { position: absolute; inset: 0; padding: 38px 56px; display: grid; grid-template-rows: auto 1fr auto; }
  .top, .bottom { display: flex; justify-content: space-between; align-items: center; font: 400 13px "Geist Mono", monospace; letter-spacing: .12em; color: #B3C4CB; }
  .top .kick { color: #5EF2D6; letter-spacing: .1em; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { overflow: visible; }
  .word { font: 400 32px "Instrument Serif", serif; color: #F7FBFA; letter-spacing: -.01em; }
  .word span { font: 400 20px "Geist Mono", monospace; color: #5EF2D6; letter-spacing: 0; }
  h1 { margin: 0; align-self: center; font: 400 92px/.94 "Instrument Serif", serif; letter-spacing: -.02em; }
  h1 em { color: #5EF2D6; }
  .rule { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: #5EF2D6; }
</style>
</head>
<body>
<div class="banner">
  <canvas id="f"></canvas><canvas id="g" class="glow"></canvas>
  <div class="fade"></div>
  <div class="content">
    <div class="top"><span class="brand"><svg width="30" height="28" viewBox="-1 0 26 24" fill="none" stroke="#5EF2D6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l3 5-3 5" opacity=".7"/><path d="M10 5l4 7-4 7"/><path d="M18 8l2.5 4-2.5 4" opacity=".85"/></svg><span class="word">shoal<span>.ing</span></span></span><span class="kick">LAUNCH REHEARSAL</span></div>
    <h1>Rehearse your <em>launch</em>.</h1>
    <div class="bottom"><span>POST → 10,000 SIMULATED DEVELOPERS → PREDICTED THREAD</span><span>SHOAL.ING</span></div>
  </div>
  <div class="rule"></div>
</div>
<script src="shoal-field.js"></script>
<script>
  shoalField(document.getElementById('f'), { w: 1280, h: 400, seed: 5, scale: 1.1, snow: 110, schools: [
    { x: 960, y: 190, r: 110, n: 750, g: 0, cw: 1 },
    { x: 1150, y: 280, r: 70, n: 280, g: 1, cw: 0 },
    { x: 820, y: 300, r: 60, n: 220, g: 2, cw: 1 } ] });
  var g = document.getElementById('g'); g.width = 1280; g.height = 400; g.getContext('2d').drawImage(document.getElementById('f'), 0, 0);
</script>
</body>
</html>
