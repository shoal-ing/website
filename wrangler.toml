# shoal.ing on Cloudflare: a Worker that only serves static assets.
# No script runs; Cloudflare serves dist/ and applies _headers and _redirects.
# Build and deploy with tools/deploy.sh, never `wrangler deploy` from a working copy.
name = "shoal-website"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

# Custom domains, attached by the deploy itself. They need the shoal.ing zone
# to be active on the Factory0 account (nameservers pointed at Cloudflare).
[[routes]]
pattern = "shoal.ing"
custom_domain = true

[[routes]]
pattern = "www.shoal.ing"
custom_domain = true
