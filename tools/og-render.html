<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #04121C; width: 1200px; height: 630px; overflow: hidden; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; color: #F7FBFA; font-family: "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  canvas { position: absolute; inset: 0; width: 1200px; height: 630px; }
  .glow { filter: blur(10px); opacity: .5; }
  .fade { position: absolute; inset: 0; background: linear-gradient(90deg, #04121C 0%, #04121C 40%, rgba(4,18,28,0) 72%), radial-gradient(ellipse at 70% 40%, transparent 30%, rgba(0,0,0,.4) 100%); }
  .content { position: absolute; left: 72px; top: 64px; bottom: 64px; width: 640px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand svg { overflow: visible; }
  .word { font: 400 44px "Instrument Serif", serif; letter-spacing: -.01em; }
  .word span { font: 400 27px "Geist Mono", monospace; color: #5EF2D6; }
  h1 { margin: auto 0 0; font: 400 112px/.94 "Instrument Serif", serif; letter-spacing: -.02em; }
  h1 em { color: #5EF2D6; }
  p { margin: 26px 0 0; font-size: 23px; line-height: 1.45; color: #B3C4CB; max-width: 600px; }
  .meta { margin-top: 30px; display: flex; gap: 22px; font: 400 15px "Geist Mono", monospace; color: #B3C4CB; letter-spacing: .02em; }
  .meta b { font-weight: 400; color: #5EF2D6; }
  .bubble { position: absolute; right: 64px; top: 92px; width: 340px; padding: 14px 16px; border: 1px solid #2A5878; border-radius: 8px; background: #0A1F2E; display: flex; flex-direction: column; gap: 7px; }
  .bubble div:first-child { display: flex; gap: 10px; font: 500 12px "Geist Mono", monospace; letter-spacing: .06em; }
  .bubble div:last-child { font-size: 16px; line-height: 1.45; }
</style>
</head>

<div class="card">
